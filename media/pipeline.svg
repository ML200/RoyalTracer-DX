<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 720" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="pgRaygen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8f0ff"/>
      <stop offset="100%" stop-color="#c0d8f8"/>
    </linearGradient>
    <linearGradient id="pgTemporal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff0e0"/>
      <stop offset="100%" stop-color="#f0d8a8"/>
    </linearGradient>
    <linearGradient id="pgPartner" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffe8f0"/>
      <stop offset="100%" stop-color="#f0b8d0"/>
    </linearGradient>
    <linearGradient id="pgSpatial" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8ffe8"/>
      <stop offset="100%" stop-color="#a8d8a8"/>
    </linearGradient>
    <linearGradient id="pgDup" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8f8ff"/>
      <stop offset="100%" stop-color="#a8c8e0"/>
    </linearGradient>
    <linearGradient id="pgShading" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8f8f0"/>
      <stop offset="100%" stop-color="#e0e0c8"/>
    </linearGradient>
    <linearGradient id="pgDLSS" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e0f8f0"/>
      <stop offset="100%" stop-color="#80d0b0"/>
    </linearGradient>
    <linearGradient id="pgPost" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff8e8"/>
      <stop offset="100%" stop-color="#f0e0a0"/>
    </linearGradient>
    <marker id="arrowBlack" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#555"/>
    </marker>
    <marker id="arrowTemporal" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#c06020"/>
    </marker>
    <marker id="arrowDup" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#2080a0"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="720" height="720" fill="white" rx="8"/>

  <!-- 1. Path Tracing -->
  <rect x="100" y="20" width="520" height="70" rx="6" fill="url(#pgRaygen)" stroke="#80a0d0" stroke-width="1.5"/>
  <text x="360" y="48" text-anchor="middle" font-size="17" font-weight="600" fill="#333">Path Tracing</text>
  <text x="360" y="70" text-anchor="middle" font-size="11" fill="#666">Multi-bounce PT with NEE  ·  G-buffer  ·  Writes unified DI/GI reservoir (matID-keyed)</text>

  <!-- 2. Temporal Reuse -->
  <rect x="100" y="110" width="520" height="70" rx="6" fill="url(#pgTemporal)" stroke="#c0a060" stroke-width="1.5"/>
  <text x="360" y="138" text-anchor="middle" font-size="15" font-weight="600" fill="#333">Temporal Reuse</text>
  <text x="360" y="158" text-anchor="middle" font-size="11" fill="#666">Pairwise MIS  ·  permutation sampling  ·  M-cap lerped toward 1 where prev-frame D is high</text>

  <!-- 3. Reuse-Texture Partner Select -->
  <rect x="100" y="200" width="520" height="70" rx="6" fill="url(#pgPartner)" stroke="#c08098" stroke-width="1.5"/>
  <text x="360" y="227" text-anchor="middle" font-size="15" font-weight="600" fill="#333">Reuse-Texture Partner Select</text>
  <text x="360" y="247" text-anchor="middle" font-size="11" fill="#666">Self-inverting 3-slot lookups give every pixel a symmetric spatial partner</text>

  <!-- 4. Spatial Reuse -->
  <rect x="100" y="290" width="520" height="70" rx="6" fill="url(#pgSpatial)" stroke="#70a070" stroke-width="1.5"/>
  <text x="360" y="317" text-anchor="middle" font-size="15" font-weight="600" fill="#333">Spatial Reuse</text>
  <text x="360" y="337" text-anchor="middle" font-size="11" fill="#666">Reconnection shift  ·  pairwise MIS  ·  combined DI + GI radiance</text>

  <!-- 5. Duplication Map -->
  <rect x="100" y="380" width="520" height="65" rx="6" fill="url(#pgDup)" stroke="#6090c0" stroke-width="1.5"/>
  <text x="360" y="406" text-anchor="middle" font-size="15" font-weight="600" fill="#333">Duplication Map</text>
  <text x="360" y="425" text-anchor="middle" font-size="11" fill="#666">V2 (reconnection-vertex) matches in 17×17 window  ·  D ∈ [0, 1] drives next frame's M-cap</text>

  <!-- 6. Shading -->
  <rect x="100" y="465" width="520" height="60" rx="6" fill="url(#pgShading)" stroke="#b0b090" stroke-width="1.5"/>
  <text x="360" y="490" text-anchor="middle" font-size="16" font-weight="600" fill="#333">Shading &amp; Accumulation</text>
  <text x="360" y="509" text-anchor="middle" font-size="11" fill="#666">Motion vectors  ·  DLSS-RR inputs (depth, normals, albedo, roughness)</text>

  <!-- 7. DLSS -->
  <rect x="100" y="540" width="520" height="55" rx="6" fill="url(#pgDLSS)" stroke="#60b090" stroke-width="1.5"/>
  <text x="360" y="563" text-anchor="middle" font-size="16" font-weight="600" fill="#333">DLSS Ray Reconstruction</text>
  <text x="360" y="581" text-anchor="middle" font-size="11" fill="#666">Denoising  ·  Super resolution</text>

  <!-- 8. Post-Process -->
  <rect x="100" y="610" width="520" height="50" rx="6" fill="url(#pgPost)" stroke="#c0b060" stroke-width="1.5"/>
  <text x="360" y="635" text-anchor="middle" font-size="16" font-weight="600" fill="#333">Post-Process</text>
  <text x="360" y="651" text-anchor="middle" font-size="11" fill="#666">PBR Neutral tone mapping  ·  sRGB gamma</text>

  <!-- Forward arrows (centered vertical flow) -->
  <line x1="360" y1="90"  x2="360" y2="103" stroke="#555" stroke-width="1.5" marker-end="url(#arrowBlack)"/>
  <line x1="360" y1="180" x2="360" y2="193" stroke="#555" stroke-width="1.5" marker-end="url(#arrowBlack)"/>
  <line x1="360" y1="270" x2="360" y2="283" stroke="#555" stroke-width="1.5" marker-end="url(#arrowBlack)"/>
  <line x1="360" y1="360" x2="360" y2="373" stroke="#555" stroke-width="1.5" marker-end="url(#arrowBlack)"/>
  <line x1="360" y1="445" x2="360" y2="458" stroke="#555" stroke-width="1.5" marker-end="url(#arrowBlack)"/>
  <line x1="360" y1="525" x2="360" y2="533" stroke="#555" stroke-width="1.5" marker-end="url(#arrowBlack)"/>
  <line x1="360" y1="595" x2="360" y2="603" stroke="#555" stroke-width="1.5" marker-end="url(#arrowBlack)"/>

  <!-- Temporal feedback: Spatial Reuse output -> right -> up -> back into Temporal Reuse -->
  <path d="M 620,325 L 670,325 L 670,135 L 620,135"
        fill="none" stroke="#c06020" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#arrowTemporal)"/>
  <text x="697" y="225" text-anchor="middle" font-size="11" font-weight="600" fill="#c06020" transform="rotate(90, 697, 225)">prev frame spatial reservoirs</text>

  <!-- Duplication-map feedback: Duplication Map output -> left -> up -> back into Temporal Reuse -->
  <path d="M 100,410 L 50,410 L 50,155 L 100,155"
        fill="none" stroke="#2080a0" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#arrowDup)"/>
  <text x="28" y="285" text-anchor="middle" font-size="11" font-weight="600" fill="#2080a0" transform="rotate(-90, 28, 285)">prev frame duplication map</text>

  <!-- Legend -->
  <rect x="100" y="680" width="520" height="28" rx="6" fill="#fafafa" stroke="#e0e0e0" stroke-width="1"/>
  <line x1="115" y1="695" x2="145" y2="695" stroke="#555" stroke-width="2"/>
  <text x="150" y="699" font-size="10" fill="#666">Current frame</text>
  <line x1="235" y1="695" x2="265" y2="695" stroke="#c06020" stroke-width="2" stroke-dasharray="6,3"/>
  <text x="270" y="699" font-size="10" fill="#666">Prev spatial reservoirs</text>
  <line x1="415" y1="695" x2="445" y2="695" stroke="#2080a0" stroke-width="2" stroke-dasharray="6,3"/>
  <text x="450" y="699" font-size="10" fill="#666">Prev duplication map</text>
</svg>
