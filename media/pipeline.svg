<svg xmlns="http://www.w3.org/2000/svg" width="960" height="302" viewBox="0 0 960 302" role="img" aria-labelledby="title desc">
  <title id="title">Regular path tracing pipeline</title>
  <desc id="desc">Light trees with learned cuts and path guiding support both SHARC training and path tracing. The three main stages are SHARC training and resolve, path tracing with cache queries, and ReSTIR spatial reuse using reciprocal texture pairs.</desc>
  <style>
    .canvas { fill: #ffffff; }
    .panel { fill: #f6f8fa; stroke: #d1d9e0; }
    .cache { fill: #eef6ff; stroke: #0969da; }
    .trace { fill: #f6f8fa; stroke: #59636e; }
    .reuse { fill: #f0f6f2; stroke: #1a7f37; }
    .label { fill: #1f2328; font-size: 21px; font-weight: 600; }
    .detail { fill: #59636e; font-size: 16px; }
    .flow { fill: none; stroke: #59636e; stroke-width: 1.5; }
    .arrow { fill: #59636e; }
    @media (prefers-color-scheme: dark) {
      .canvas { fill: #0d1117; }
      .panel { fill: #151b23; stroke: #3d444d; }
      .cache { fill: #101f33; stroke: #4493f8; }
      .trace { fill: #151b23; stroke: #9198a1; }
      .reuse { fill: #12261e; stroke: #3fb950; }
      .label { fill: #f0f6fc; }
      .detail { fill: #b1bac4; }
      .flow { stroke: #9198a1; }
      .arrow { fill: #9198a1; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path class="arrow" d="M0 0 8 4 0 8Z" />
    </marker>
  </defs>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">
    <rect class="canvas" width="960" height="302" rx="8" />
    <rect class="panel" x="32" y="28" width="568" height="70" rx="6" />
    <text class="label" x="316" y="58" font-size="18">Light tree + learned cuts</text>
    <text class="detail" x="316" y="82">Path guiding</text>
    <path class="flow" d="M156 98V153" marker-end="url(#arrow)" />
    <path class="flow" d="M472 98V153" marker-end="url(#arrow)" />
    <rect class="cache" x="32" y="164" width="248" height="106" rx="6" />
    <text class="label" x="156" y="207">SHARC</text>
    <text class="detail" x="156" y="238">Train + resolve</text>
    <path class="flow" d="M290 217H338" marker-end="url(#arrow)" />
    <rect class="trace" x="348" y="164" width="248" height="106" rx="6" />
    <text class="label" x="472" y="207">Path tracing</text>
    <text class="detail" x="472" y="238">Trace + query cache</text>
    <path class="flow" d="M606 217H654" marker-end="url(#arrow)" />
    <rect class="reuse" x="664" y="164" width="264" height="106" rx="6" />
    <text class="label" x="796" y="207">ReSTIR spatial reuse</text>
    <text class="detail" x="796" y="238">Texture pairs + merge</text>
  </g>
</svg>
