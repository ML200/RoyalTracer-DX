<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 660" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="pgRaygen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8f0ff"/>
      <stop offset="100%" stop-color="#c0d8f8"/>
    </linearGradient>
    <linearGradient id="pgTemporal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff0e0"/>
      <stop offset="100%" stop-color="#f0d8a8"/>
    </linearGradient>
    <linearGradient id="pgBoil" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8f0f8"/>
      <stop offset="100%" stop-color="#e8d0e8"/>
    </linearGradient>
    <linearGradient id="pgSpatial" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8ffe8"/>
      <stop offset="100%" stop-color="#a8d8a8"/>
    </linearGradient>
    <linearGradient id="pgShading" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8f8f0"/>
      <stop offset="100%" stop-color="#e0e0c8"/>
    </linearGradient>
    <linearGradient id="pgDLSS" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e0f8f0"/>
      <stop offset="100%" stop-color="#80d0b0"/>
    </linearGradient>
    <linearGradient id="pgPost" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff8e8"/>
      <stop offset="100%" stop-color="#f0e0a0"/>
    </linearGradient>
    <marker id="arrowBlack" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#555"/>
    </marker>
    <marker id="arrowTemporal" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#c06020"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="900" height="660" fill="white" rx="8"/>

  <!-- Column headers -->
  <text x="260" y="28" text-anchor="middle" font-size="14" font-weight="700" fill="#888">Direct Illumination</text>
  <text x="640" y="28" text-anchor="middle" font-size="14" font-weight="700" fill="#888">Global Illumination</text>

  <!-- ===== 1. PATH TRACING (full width) ===== -->
  <rect x="90" y="40" width="720" height="70" rx="6" fill="url(#pgRaygen)" stroke="#80a0d0" stroke-width="1.5"/>
  <text x="450" y="67" text-anchor="middle" font-size="17" font-weight="600" fill="#333">Path Tracing</text>
  <text x="450" y="87" text-anchor="middle" font-size="12" fill="#666">Multi-bounce path tracing with NEE  ·  Initializes DI and GI reservoirs  ·  Writes G-buffer</text>

  <!-- Divider line -->
  <line x1="450" y1="125" x2="450" y2="370" stroke="#ddd" stroke-width="1" stroke-dasharray="6,4"/>

  <!-- ===== 2. TEMPORAL DI ===== -->
  <rect x="90" y="125" width="340" height="65" rx="6" fill="url(#pgTemporal)" stroke="#c0a060" stroke-width="1.5"/>
  <text x="260" y="152" text-anchor="middle" font-size="15" font-weight="600" fill="#333">Temporal Reuse</text>
  <text x="260" y="170" text-anchor="middle" font-size="11" fill="#666">Pairwise MIS with previous frame's spatial output</text>

  <!-- ===== 3. BOIL DI ===== -->
  <rect x="90" y="202" width="340" height="45" rx="6" fill="url(#pgBoil)" stroke="#b090b0" stroke-width="1.5"/>
  <text x="260" y="230" text-anchor="middle" font-size="14" font-weight="600" fill="#333">Boiling Filter</text>

  <!-- ===== 4. TEMPORAL GI ===== -->
  <rect x="470" y="125" width="340" height="65" rx="6" fill="url(#pgTemporal)" stroke="#c0a060" stroke-width="1.5"/>
  <text x="640" y="152" text-anchor="middle" font-size="15" font-weight="600" fill="#333">Temporal Reuse</text>
  <text x="640" y="170" text-anchor="middle" font-size="11" fill="#666">Pairwise MIS with previous frame's spatial output</text>

  <!-- ===== 5. BOIL GI ===== -->
  <rect x="470" y="202" width="340" height="45" rx="6" fill="url(#pgBoil)" stroke="#b090b0" stroke-width="1.5"/>
  <text x="640" y="230" text-anchor="middle" font-size="14" font-weight="600" fill="#333">Boiling Filter</text>

  <!-- ===== 6. SPATIAL DI ===== -->
  <rect x="90" y="262" width="340" height="65" rx="6" fill="url(#pgSpatial)" stroke="#70a070" stroke-width="1.5"/>
  <text x="260" y="289" text-anchor="middle" font-size="15" font-weight="600" fill="#333">Spatial Reuse</text>
  <text x="260" y="307" text-anchor="middle" font-size="11" fill="#666">Single-neighbor resampling  ·  Outputs DI radiance</text>

  <!-- ===== 7. SPATIAL GI SELECT ===== -->
  <rect x="470" y="262" width="340" height="40" rx="6" fill="url(#pgSpatial)" stroke="#70a070" stroke-width="1.5" opacity="0.7"/>
  <text x="640" y="287" text-anchor="middle" font-size="14" font-weight="600" fill="#333">Neighbor Selection</text>

  <!-- ===== 8. SPATIAL GI MERGE ===== -->
  <rect x="470" y="312" width="340" height="55" rx="6" fill="url(#pgSpatial)" stroke="#70a070" stroke-width="1.5"/>
  <text x="640" y="335" text-anchor="middle" font-size="15" font-weight="600" fill="#333">Spatial Merge</text>
  <text x="640" y="353" text-anchor="middle" font-size="11" fill="#666">Reconnection shift  ·  Outputs GI radiance</text>

  <!-- ===== 9. SHADING (full width) ===== -->
  <rect x="90" y="385" width="720" height="65" rx="6" fill="url(#pgShading)" stroke="#b0b090" stroke-width="1.5"/>
  <text x="450" y="412" text-anchor="middle" font-size="16" font-weight="600" fill="#333">Shading &amp; Accumulation</text>
  <text x="450" y="430" text-anchor="middle" font-size="11" fill="#666">Combines DI + GI + sun  ·  Motion vectors  ·  DLSS-RR inputs (depth, normals, albedo, roughness)</text>

  <!-- ===== 10. DLSS ===== -->
  <rect x="90" y="468" width="720" height="55" rx="6" fill="url(#pgDLSS)" stroke="#60b090" stroke-width="1.5"/>
  <text x="450" y="492" text-anchor="middle" font-size="16" font-weight="600" fill="#333">DLSS Ray Reconstruction</text>
  <text x="450" y="508" text-anchor="middle" font-size="11" fill="#666">Denoising  ·  Super resolution</text>

  <!-- ===== 11. POST-PROCESS ===== -->
  <rect x="90" y="541" width="720" height="50" rx="6" fill="url(#pgPost)" stroke="#c0b060" stroke-width="1.5"/>
  <text x="450" y="570" text-anchor="middle" font-size="16" font-weight="600" fill="#333">Post-Process</text>
  <text x="450" y="584" text-anchor="middle" font-size="11" fill="#666">PBR Neutral tone mapping  ·  sRGB gamma</text>

  <!-- ===== FORWARD ARROWS (main pipeline flow) ===== -->
  <!-- Raygen -> Temporal DI -->
  <line x1="260" y1="110" x2="260" y2="117" stroke="#555" stroke-width="1.5" marker-end="url(#arrowBlack)"/>
  <!-- Raygen -> Temporal GI -->
  <line x1="640" y1="110" x2="640" y2="117" stroke="#555" stroke-width="1.5" marker-end="url(#arrowBlack)"/>
  <!-- Temporal DI -> Boil DI -->
  <line x1="260" y1="190" x2="260" y2="194" stroke="#555" stroke-width="1.5" marker-end="url(#arrowBlack)"/>
  <!-- Boil DI -> Spatial DI -->
  <line x1="260" y1="247" x2="260" y2="254" stroke="#555" stroke-width="1.5" marker-end="url(#arrowBlack)"/>
  <!-- Temporal GI -> Boil GI -->
  <line x1="640" y1="190" x2="640" y2="194" stroke="#555" stroke-width="1.5" marker-end="url(#arrowBlack)"/>
  <!-- Boil GI -> Spatial GI Select -->
  <line x1="640" y1="247" x2="640" y2="254" stroke="#555" stroke-width="1.5" marker-end="url(#arrowBlack)"/>
  <!-- Spatial GI Select -> Spatial GI Merge -->
  <line x1="640" y1="302" x2="640" y2="304" stroke="#555" stroke-width="1.5" marker-end="url(#arrowBlack)"/>
  <!-- Spatial DI -> Shading -->
  <line x1="260" y1="327" x2="260" y2="377" stroke="#555" stroke-width="1.5" marker-end="url(#arrowBlack)"/>
  <!-- Spatial GI Merge -> Shading -->
  <line x1="640" y1="367" x2="640" y2="377" stroke="#555" stroke-width="1.5" marker-end="url(#arrowBlack)"/>
  <!-- Shading -> DLSS -->
  <line x1="450" y1="450" x2="450" y2="460" stroke="#555" stroke-width="1.5" marker-end="url(#arrowBlack)"/>
  <!-- DLSS -> Post -->
  <line x1="450" y1="523" x2="450" y2="533" stroke="#555" stroke-width="1.5" marker-end="url(#arrowBlack)"/>

  <!-- ===== TEMPORAL FEEDBACK ARROWS ===== -->

  <!-- DI: Spatial output -> left edge -> up -> back into Temporal DI -->
  <path d="M 90,310 L 58,310 L 58,145 L 90,145"
        fill="none" stroke="#c06020" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#arrowTemporal)"/>
  <text x="25" y="235" text-anchor="middle" font-size="10" font-weight="600" fill="#c06020" transform="rotate(-90, 25, 235)">prev frame spatial DI</text>

  <!-- GI: Spatial GI Merge output -> right edge -> up -> back into Temporal GI -->
  <path d="M 810,340 L 842,340 L 842,145 L 810,145"
        fill="none" stroke="#c06020" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#arrowTemporal)"/>
  <text x="875" y="250" text-anchor="middle" font-size="10" font-weight="600" fill="#c06020" transform="rotate(90, 875, 250)">prev frame spatial GI</text>

  <!-- ===== LEGEND ===== -->
  <rect x="90" y="610" width="720" height="40" rx="6" fill="#fafafa" stroke="#e0e0e0" stroke-width="1"/>
  <line x1="120" y1="633" x2="160" y2="633" stroke="#555" stroke-width="2"/>
  <text x="168" y="637" font-size="11" fill="#666">Current frame data flow</text>
  <line x1="380" y1="633" x2="420" y2="633" stroke="#c06020" stroke-width="2" stroke-dasharray="6,3"/>
  <text x="428" y="637" font-size="11" fill="#666">Temporal feedback (previous frame's spatial output)</text>
</svg>
