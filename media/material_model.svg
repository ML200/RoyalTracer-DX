<svg xmlns="http://www.w3.org/2000/svg" width="960" height="334" viewBox="0 0 960 334" role="img" aria-labelledby="title desc">
  <title id="title">Layered material model</title>
  <desc id="desc">Scattering layers in evaluation order: Charlie sheen, GGX clearcoat, anisotropic GGX reflection and transmission, and Lambertian diffuse. Each layer attenuates the layers below it. Surface emission is separate.</desc>
  <style>
    .canvas { fill: #ffffff; }
    .layer { fill: #f6f8fa; stroke: #d1d9e0; }
    .ggx { fill: #eef6ff; stroke: #0969da; }
    .emission { fill: #fff8e6; stroke: #9a6700; }
    .label { fill: #1f2328; font-size: 20px; font-weight: 600; }
    .detail { fill: #59636e; font-size: 17px; }
    .flow { fill: none; stroke: #59636e; stroke-width: 1.5; }
    .arrow { fill: #59636e; }
    @media (prefers-color-scheme: dark) {
      .canvas { fill: #0d1117; }
      .layer { fill: #151b23; stroke: #3d444d; }
      .ggx { fill: #101f33; stroke: #4493f8; }
      .emission { fill: #272115; stroke: #d29922; }
      .label { fill: #f0f6fc; }
      .detail { fill: #b1bac4; }
      .flow { stroke: #9198a1; }
      .arrow { fill: #9198a1; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path class="arrow" d="M0 0 8 4 0 8Z" />
    </marker>
  </defs>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <rect class="canvas" width="960" height="334" rx="8" />
    <path class="flow" d="M36 48V286" marker-end="url(#arrow)" />
    <rect class="layer" x="64" y="28" width="660" height="58" rx="6" />
    <text class="label" x="88" y="64">Sheen</text>
    <text class="detail" x="700" y="64" text-anchor="end">Charlie</text>
    <path class="flow" d="M394 88V96" marker-end="url(#arrow)" />
    <rect class="layer" x="64" y="102" width="660" height="58" rx="6" />
    <text class="label" x="88" y="138">Clearcoat</text>
    <text class="detail" x="700" y="138" text-anchor="end">GGX</text>
    <path class="flow" d="M394 162V170" marker-end="url(#arrow)" />
    <rect class="ggx" x="64" y="176" width="660" height="58" rx="6" />
    <text class="label" x="88" y="212">Reflection / transmission</text>
    <text class="detail" x="700" y="212" text-anchor="end">GGX</text>
    <path class="flow" d="M394 236V244" marker-end="url(#arrow)" />
    <rect class="layer" x="64" y="250" width="660" height="58" rx="6" />
    <text class="label" x="88" y="286">Diffuse</text>
    <text class="detail" x="700" y="286" text-anchor="end">Lambert</text>
    <rect class="emission" x="752" y="28" width="176" height="280" rx="6" />
    <text class="label" x="840" y="176" text-anchor="middle">Emission</text>
  </g>
</svg>
