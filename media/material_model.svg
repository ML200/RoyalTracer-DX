<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 480" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <!-- Coat gradient (warm red fade) -->
    <linearGradient id="coatGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f5f5f5"/>
      <stop offset="100%" stop-color="#e8a0a0"/>
    </linearGradient>
    <!-- Sheen gradient (neutral gray) -->
    <linearGradient id="sheenGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0f0f0"/>
      <stop offset="100%" stop-color="#d8d8d8"/>
    </linearGradient>
    <!-- GGX Specular gradient -->
    <linearGradient id="specGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f5f5f5"/>
      <stop offset="100%" stop-color="#e0e0e0"/>
    </linearGradient>
    <!-- GGX Transmission gradient (blue tint) -->
    <linearGradient id="transGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8eef8"/>
      <stop offset="100%" stop-color="#c0d4f0"/>
    </linearGradient>
    <!-- Diffuse gradient (green tint) -->
    <linearGradient id="diffGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8f5e8"/>
      <stop offset="100%" stop-color="#b8dab8"/>
    </linearGradient>
    <!-- Emission gradient (warm yellow) -->
    <linearGradient id="emitGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff8e0"/>
      <stop offset="100%" stop-color="#ffe8a0"/>
    </linearGradient>
    <!-- Metal gradient (orange/gold) -->
    <linearGradient id="metalGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff0d8"/>
      <stop offset="100%" stop-color="#f0d090"/>
    </linearGradient>
    <!-- Transmittance bar gradient -->
    <linearGradient id="transmBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#d080d0"/>
      <stop offset="100%" stop-color="#8080e0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="820" height="480" fill="white" rx="8"/>

  <!-- ===== COAT (top layer) ===== -->
  <rect x="40" y="20" width="600" height="90" rx="6" fill="url(#coatGrad)" stroke="#c08080" stroke-width="1.5"/>
  <text x="340" y="50" text-anchor="middle" font-size="20" font-weight="600" fill="#333">Coat</text>
  <text x="340" y="78" text-anchor="middle" font-size="14" fill="#666">Dielectric GGX   ·   Fresnel transmittance</text>

  <!-- ===== SHEEN ===== -->
  <rect x="40" y="125" width="600" height="70" rx="6" fill="url(#sheenGrad)" stroke="#aaa" stroke-width="1.5"/>
  <text x="340" y="158" text-anchor="middle" font-size="20" font-weight="600" fill="#333">Sheen</text>
  <text x="340" y="180" text-anchor="middle" font-size="14" fill="#666">Charlie NDF</text>

  <!-- ===== ENERGY CASCADE BAR ===== -->
  <rect x="40" y="208" width="600" height="18" rx="3" fill="url(#transmBar)" opacity="0.7"/>
  <text x="340" y="221" text-anchor="middle" font-size="11" font-weight="600" fill="white">Energy cascade transmittance</text>

  <!-- ===== BOTTOM LOBES ===== -->

  <!-- GGX Metal (left) -->
  <rect x="40" y="242" width="175" height="120" rx="6" fill="url(#metalGrad)" stroke="#c0a060" stroke-width="1.5"/>
  <text x="127" y="290" text-anchor="middle" font-size="18" font-weight="600" fill="#333">GGX Metal</text>
  <text x="127" y="312" text-anchor="middle" font-size="12" fill="#666">Anisotropic</text>
  <text x="127" y="330" text-anchor="middle" font-size="12" fill="#666">VNDF sampling</text>

  <!-- GGX Specular + Diffuse (center-left) -->
  <g>
    <rect x="228" y="242" width="190" height="65" rx="6" fill="url(#specGrad)" stroke="#bbb" stroke-width="1.5"/>
    <text x="323" y="272" text-anchor="middle" font-size="17" font-weight="600" fill="#333">Specular</text>
    <text x="323" y="290" text-anchor="middle" font-size="12" fill="#666">Anisotropic GGX</text>

    <rect x="228" y="318" width="190" height="44" rx="6" fill="url(#diffGrad)" stroke="#90b090" stroke-width="1.5"/>
    <text x="323" y="346" text-anchor="middle" font-size="16" font-weight="600" fill="#333">Diffuse</text>
  </g>

  <!-- GGX Transmission (center-right) -->
  <rect x="430" y="242" width="210" height="120" rx="6" fill="url(#transGrad)" stroke="#90a0c0" stroke-width="1.5"/>
  <text x="535" y="280" text-anchor="middle" font-size="18" font-weight="600" fill="#333">Transmission</text>
  <text x="535" y="305" text-anchor="middle" font-size="13" fill="#666">Walter 2007 refraction</text>
  <text x="535" y="325" text-anchor="middle" font-size="13" fill="#666">IOR stack tracking</text>
  <text x="535" y="345" text-anchor="middle" font-size="13" fill="#666">Volumetric absorption</text>

  <!-- ===== EMISSION (right side, spanning full height) ===== -->
  <rect x="670" y="20" width="120" height="342" rx="6" fill="url(#emitGrad)" stroke="#d0b060" stroke-width="1.5"/>
  <text x="730" y="190" text-anchor="middle" font-size="20" font-weight="600" fill="#333">Emission</text>

  <!-- ===== PROPERTIES FOOTER ===== -->
  <rect x="40" y="390" width="750" height="70" rx="6" fill="#f8f8f8" stroke="#ddd" stroke-width="1"/>
  <text x="415" y="415" text-anchor="middle" font-size="13" font-weight="600" fill="#555">Material Properties</text>
  <text x="415" y="440" text-anchor="middle" font-size="12" fill="#777">Roughness  ·  Metallic  ·  Anisotropy + Rotation  ·  Coat Strength  ·  Sheen  ·  IOR  ·  Transmission Color  ·  Alpha Mask</text>
  <text x="415" y="455" text-anchor="middle" font-size="12" fill="#777">Albedo Map  ·  Normal Map  ·  Roughness/Metallic/AO Map  ·  Independent UV Scaling</text>

  <!-- ===== ENERGY FLOW ARROWS (left margin) ===== -->
  <line x1="20" y1="65" x2="20" y2="350" stroke="#aaa" stroke-width="1.5" stroke-dasharray="4,3"/>
  <polygon points="20,355 16,345 24,345" fill="#aaa"/>
  <text x="14" y="210" text-anchor="middle" font-size="10" fill="#999" transform="rotate(-90, 14, 210)">energy flow</text>
</svg>
